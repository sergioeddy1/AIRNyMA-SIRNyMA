<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        /* Opcional: Ocultar todo por si acaso el navegador tarda milisegundos */
        body { display: none; background-color: #003057; }
    </style>
    <script>
        (function() {
            // 1. Revisar si existe la sesión
            const sesionStr = localStorage.getItem('sirnmaUser') || sessionStorage.getItem('sirnmaUser');

            // 2. Lógica de redirección inmediata
            if (!sesionStr) {
                // CASO A: No hay usuario -> Mandar directo al LOGIN
                // Usamos .replace() para que el usuario no pueda dar click en "Atrás" y volver aquí
                window.location.replace("/login.html");
            } else {
                // CASO B: Ya hay usuario logueado -> Mandar a tu página de INICIO (la que acabas de mover)
                // Asegúrate de haber creado pages/inicio.html con el código del carrusel
                window.location.replace("/inicio.html");
            }
        })();
    </script>
</head>
<body>
    </body>
</html>
